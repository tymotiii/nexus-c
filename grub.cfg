# Nie czekaj na reakcję użytkownika, odpalaj system od razu
set timeout=3
set default=0

menuentry "Nexus" {
    # GRUB wejdzie do katalogu /boot/ na płycie ISO i załaduje nasz plik binarny
    multiboot /boot/kernel.elf
    module /boot/initrd.tar
    boot
}

menuentry "Nexus -fdsa" {
    # GRUB wejdzie do katalogu /boot/ na płycie ISO i załaduje nasz plik binarny
    multiboot /boot/kernel.elf
    module /boot/initrd.tar
    boot
}
